name: MaiBot QQ Docker
on:
  push:
    branches: [main, codex/maibot-docker]
    paths: ['maibot-qq/**', '.github/workflows/maibot-qq.yml']
  pull_request:
    paths: ['maibot-qq/**', '.github/workflows/maibot-qq.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maibot-qq-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Migration regression tests
        run: |
          python -m pip install tomlkit
          python -m unittest discover -s maibot-qq/tests -v
          bash -n maibot-qq/deploy.sh
          shellcheck maibot-qq/deploy.sh
          docker compose --env-file maibot-qq/.env.example -f maibot-qq/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Image tag
        id: version
        run: echo "tag=ghcr.io/haipengtian/maibot-qq:sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: maibot-qq
          platforms: linux/amd64
          load: true
          tags: ${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=maibot-qq
          cache-to: type=gha,mode=max,scope=maibot-qq
      - name: Smoke check image and instance initialization
        env:
          IMAGE: ${{ steps.version.outputs.tag }}
        run: bash maibot-qq/tests/image-smoke.sh "$IMAGE"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.version.outputs.tag }}
        run: |
          docker push "$IMAGE"
          echo "Deployment image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
