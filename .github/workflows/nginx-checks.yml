name: Shared nginx deployment checks

on:
  push:
    paths: ['nginx/**', '.github/workflows/nginx-checks.yml']
  pull_request:
    paths: ['nginx/**', '.github/workflows/nginx-checks.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx shellcheck
      - name: Shell syntax and lint
        run: |
          find nginx -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck -P SCRIPTDIR -x nginx/*.sh nginx/tests/*.sh
      - name: Isolated installation and failure tests
        run: bash nginx/tests/run.sh
      - name: Real nginx HTTPS and reverse proxy checks
        run: bash nginx/tests/integration.sh
