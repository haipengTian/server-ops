name: ${MAIL_CENTER_PROJECT:-mail-center}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mail_center
      POSTGRES_USER: mail_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?先运行 init.sh}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U mail_center -d mail_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: ${MAIL_CENTER_API_IMAGE:?先运行 init.sh 并填写已发布的后端镜像}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mail_center:${POSTGRES_PASSWORD:?先运行 init.sh}@postgres:5432/mail_center?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8089
      SMTP_ADDR: 0.0.0.0:2525
      SMTP_DOMAIN: ${MX_HOSTNAME:?先运行 init.sh}
      DATA_DIR: /data
      ALLOWED_ORIGIN: https://${MAIL_DOMAIN:?先运行 init.sh}
      MAX_MESSAGE_BYTES: "26214400"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: https://${MAIL_DOMAIN}/api/v1/accounts/gmail/callback
    volumes:
      - ./data/mail:/data:Z
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    logging: *logging

  web:
    image: ${MAIL_CENTER_WEB_IMAGE:?先运行 init.sh 并填写已发布的前端镜像}
    restart: unless-stopped
    logging: *logging

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MAIL_CENTER_PORT:-3013}:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/healthz && wget -qO- http://127.0.0.1/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  smtp:
    profiles: [smtp]
    image: ${MAIL_CENTER_SMTP_IMAGE:?先运行 init.sh 并填写已发布的SMTP镜像}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      RECEIVE_DOMAIN: ${RECEIVE_DOMAIN:?先运行 init.sh}
      MX_HOSTNAME: ${MX_HOSTNAME}
    ports:
      - "${MAIL_CENTER_SMTP_BIND:-0.0.0.0}:${MAIL_CENTER_SMTP_PORT:-25}:25"
    volumes:
      - ./data/smtp-queue:/var/spool/postfix:Z
      - ./data/smtp-tls:/certs:ro,Z
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "postfix status"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
