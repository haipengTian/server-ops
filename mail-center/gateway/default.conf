resolver 127.0.0.11 valid=10s ipv6=off;
upstream mail_api {
    zone mail_api 64k;
    server api:8089 resolve;
}
upstream mail_web {
    zone mail_web 64k;
    server web:3000 resolve;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # Production initialization uses the server-local mail-admin command.
    location = /api/v1/auth/setup { return 403; }

    location /api/ {
        proxy_pass http://mail_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /healthz { proxy_pass http://mail_api/healthz; }
    location / {
        proxy_pass http://mail_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
