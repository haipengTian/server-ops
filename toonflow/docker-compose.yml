services:
  toonflow:
    image: ${TOONFLOW_IMAGE:?先运行 init.sh 设置已发布的个人镜像}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${TOONFLOW_HOST_PORT:-3014}:3000"
    volumes:
      - ${TOONFLOW_DATA_DIR:?先运行 init.sh}/app:/app/data:Z
    environment:
      NODE_ENV: production
      TOONFLOW_DATA_DIR: /app/data
      TOONFLOW_SERVER_PORT: "3000"
      TOONFLOW_AUTH_ENABLED: ${TOONFLOW_AUTH_ENABLED:?先运行 setup-auth.sh}
      TOONFLOW_PUBLIC_ORIGIN: ${TOONFLOW_PUBLIC_ORIGIN:?先配置公网来源}
      TOONFLOW_AUTH_USERNAME: ${TOONFLOW_AUTH_USERNAME:?先运行 setup-auth.sh}
      TOONFLOW_AUTH_PASSWORD_HASH: ${TOONFLOW_AUTH_PASSWORD_HASH:?先运行 setup-auth.sh}
      TZ: ${TZ:-Asia/Shanghai}
    mem_limit: ${TOONFLOW_MEM_LIMIT:-2g}
    cpus: ${TOONFLOW_CPUS:-2}
    pids_limit: 512
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - |
          const base = 'http://127.0.0.1:3000';
          const headers = { host: new URL(process.env.TOONFLOW_PUBLIC_ORIGIN).host };
          const page = await fetch(base + '/login', { headers, signal: AbortSignal.timeout(5000) });
          if (!page.ok || !(await page.text()).includes('/api/auth/login')) process.exit(1);
          const response = await fetch(base + '/api/auth/session', { headers, signal: AbortSignal.timeout(5000) });
          if (!response.ok) process.exit(1);
          const result = await response.json();
          if (result.code !== 200 || result.data?.enabled !== true || result.data?.authenticated !== false) process.exit(1);
          const protectedResponse = await fetch(base + '/api/workspaces/list', { headers, signal: AbortSignal.timeout(5000) });
          if (protectedResponse.status !== 401) process.exit(1);
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 60s
